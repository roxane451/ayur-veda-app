name: CI/CD — Ayur-Veda

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/**"
      - develop
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-rc"
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  packages: write
  security-events: write

jobs:

  # ─────────────────────────────────────────────────────────────
  # Job 1 : Scan des secrets
  # ─────────────────────────────────────────────────────────────
  secret-scan:
    uses: roxane451/ci-cd-helm/.github/workflows/reusable-secret-scan.yml@main
    secrets: inherit

  # ─────────────────────────────────────────────────────────────
  # Job 2 : Lint et tests unitaires
  # ─────────────────────────────────────────────────────────────
  lint-test:
    uses: roxane451/ci-cd-helm/.github/workflows/reusable-lint-test.yml@main
    secrets: inherit

  # ─────────────────────────────────────────────────────────────
  # Job 3 : Build + Push backend
  # ─────────────────────────────────────────────────────────────
  build-backend:
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/tags/')
    needs: [secret-scan, lint-test]
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: roxane451/ci-cd-helm/.github/workflows/reusable-build-push.yml@main
    with:
      image-name: backend
      context: ./backend
      # image-tag: ${{ github.sha }}
    secrets: inherit

  # ─────────────────────────────────────────────────────────────
  # Job 4 : Build + Push frontend
  # ─────────────────────────────────────────────────────────────
  build-frontend:
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/tags/')
    needs: [secret-scan, lint-test]
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: roxane451/ci-cd-helm/.github/workflows/reusable-build-push.yml@main
    with:
      image-name: frontend
      context: ./frontend
      # image-tag: ${{ github.sha }}
    secrets: inherit

  # ─────────────────────────────────────────────────────────────
  # Job 5 : Smoke test K3D (main uniquement)
  # ─────────────────────────────────────────────────────────────
  smoke-test:
    if: github.ref == 'refs/heads/main'
    needs: [build-backend, build-frontend]
    uses: roxane451/ci-cd-helm/.github/workflows/reusable-smoke-test-k3d.yml@main
    with:
      image-tag: ${{ needs.build-backend.outputs.image-tag }}
      namespace: ayur-smoke
    secrets: inherit

  # ─────────────────────────────────────────────────────────────
  # Job 6 : Déploiement preprod via ArgoCD (main uniquement)
  # ArgoCD sync automatique après mise à jour du tag dans ayur-veda-helm
  # ─────────────────────────────────────────────────────────────
  deploy-preprod:
    if: github.ref == 'refs/heads/main'
    needs: [smoke-test]
    uses: roxane451/ci-cd-helm/.github/workflows/reusable-argocd-sync.yml@main
    with:
      environment: preprod
      image-tag: ${{ needs.build-backend.outputs.image-tag }}
      values-file: values-preprod.yaml
    secrets: inherit

  # ─────────────────────────────────────────────────────────────
  # Job 7 : Déploiement prod via ArgoCD (tags stables uniquement)
  # ─────────────────────────────────────────────────────────────
  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-rc')
    needs: [build-backend, build-frontend]
    uses: roxane451/ci-cd-helm/.github/workflows/reusable-argocd-sync.yml@main
    with:
      environment: prod
      image-tag: ${{ github.ref_name }}
      values-file: values-production.yaml
    secrets: inherit