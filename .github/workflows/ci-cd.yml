name: CI/CD — Ayur-Veda

on:
  push:
    branches:
      - "feature/**"
      - develop
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-rc"
      - "v[0-9]+.[0-9]+.[0-9]+"

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  secret-scan:
    uses: roxane451/ci-cd-helm/.github/workflows/reusable-secret-scan.yml@main
    secrets: inherit

  lint-test:
    uses: roxane451/ci-cd-helm/.github/workflows/reusable-lint-test.yml@main
    secrets: inherit

  build-backend:
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/tags/')
    needs: [secret-scan, lint-test]
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: roxane451/ci-cd-helm/.github/workflows/reusable-build-push.yml@main
    with:
      image-name: backend
      context: ./backend        # fix bug 2 : input requis manquant
      # dockerfile supprimé     # fix bug 3 : input non déclaré dans le workflow réutilisable
    secrets: inherit

  build-frontend:
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/tags/')
    needs: [secret-scan, lint-test]
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: roxane451/ci-cd-helm/.github/workflows/reusable-build-push.yml@main
    with:
      image-name: frontend
      context: ./frontend       # fix bug 2 : input requis manquant
      # dockerfile supprimé     # fix bug 3 : input non déclaré dans le workflow réutilisable
    secrets: inherit

  # upload-sarif-backend:
  #   if: always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
  #   needs: [build-backend]
  #   runs-on: ubuntu-latest
  #   permissions:
  #     security-events: write
  #   steps:
  #     - uses: actions/download-artifact@v4
  #       with:
  #         name: trivy-backend-sarif
  #     - uses: github/codeql-action/upload-sarif@v3
  #       with:
  #         sarif_file: trivy-backend.sarif

  # upload-sarif-frontend:
  #   if: always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
  #   needs: [build-frontend]
  #   runs-on: ubuntu-latest
  #   permissions:
  #     security-events: write
  #   steps:
  #     - uses: actions/download-artifact@v4
  #       with:
  #         name: trivy-frontend-sarif
  #     - uses: github/codeql-action/upload-sarif@v3
  #       with:
  #         sarif_file: trivy-frontend.sarif

  smoke-test:
    if: github.ref == 'refs/heads/main'
    needs: [build-backend, build-frontend]
    uses: roxane451/ci-cd-helm/.github/workflows/reusable-smoke-test-k3d.yml@main
    with:
      image-tag: ${{ needs.build-backend.outputs.image-tag }}
      namespace: ayur-smoke     # fix bug 1 : input désormais déclaré dans le workflow réutilisable
    secrets: inherit

  deploy-preprod:
    if: startsWith(github.ref, 'refs/tags/') && contains(github.ref, '-rc')
    needs: [build-backend, build-frontend]  # smoke-test ne tourne pas sur les tags → dépendance volontairement omise
    uses: roxane451/ci-cd-helm/.github/workflows/reusable-helm-deploy.yml@main
    with:
      environment: preprod
      image-tag: ${{ github.ref_name }}
      helm-values-file: helm/values-preprod.yaml
    secrets: inherit

  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-rc')
    needs: [build-backend, build-frontend]  # smoke-test ne tourne pas sur les tags → dépendance volontairement omise
    uses: roxane451/ci-cd-helm/.github/workflows/reusable-helm-deploy.yml@main
    with:
      environment: prod
      image-tag: ${{ github.ref_name }}
      helm-values-file: helm/values-production.yaml
    secrets: inherit