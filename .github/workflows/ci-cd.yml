name: CI/CD — Ayur-Veda

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/**"
      - develop
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-rc"
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  packages: write
  security-events: write

jobs:

  # ─────────────────────────────────────────────────────────────
  # Job 1 : Scan des secrets
  # ─────────────────────────────────────────────────────────────
  secret-scan:
    uses: roxane451/ci-cd-helm/.github/workflows/reusable-secret-scan.yml@main
    secrets: inherit

  # ─────────────────────────────────────────────────────────────
  # Job 2 : Lint et tests unitaires
  # ─────────────────────────────────────────────────────────────
  lint-test:
    uses: roxane451/ci-cd-helm/.github/workflows/reusable-lint-test.yml@main
    secrets: inherit

  # ─────────────────────────────────────────────────────────────
  # Job 3 : Build + Push backend
  # ─────────────────────────────────────────────────────────────
  build-backend:
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/tags/')
    needs: [secret-scan, lint-test]
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: roxane451/ci-cd-helm/.github/workflows/reusable-build-push.yml@main
    with:
      image-name: backend
      context: ./backend
      # image-tag: ${{ github.sha }}
    secrets: inherit

  # ─────────────────────────────────────────────────────────────
  # Job 4 : Build + Push frontend
  # ─────────────────────────────────────────────────────────────
  build-frontend:
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/tags/')
    needs: [secret-scan, lint-test]
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: roxane451/ci-cd-helm/.github/workflows/reusable-build-push.yml@main
    with:
      image-name: frontend
      context: ./frontend
      # image-tag: ${{ github.sha }}
    secrets: inherit

  # ─────────────────────────────────────────────────────────────
  # Job 5 : Smoke test K3D (main uniquement)
  # ─────────────────────────────────────────────────────────────
  smoke-test:
    if: github.ref == 'refs/heads/main'
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Create cluster k3d
        run: |
          k3d cluster delete ayur-smoke 2>/dev/null || true
          k3d cluster create ayur-smoke --wait --timeout 60s

      - name: Configure kubeconfig
        run: k3d kubeconfig merge ayur-smoke --kubeconfig-switch-context

      - name: Create namespace + GHCR secret
        run: |
          kubectl create namespace ayur-smoke --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace ayur-smoke app.kubernetes.io/managed-by=Helm --overwrite
          kubectl annotate namespace ayur-smoke meta.helm.sh/release-name=ayurveda meta.helm.sh/release-namespace=ayur-smoke --overwrite
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.PAT_HELM_REPO }} \
            --namespace=ayur-smoke \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Login Helm GHCR
        run: |
          echo "${{ secrets.PAT_HELM_REPO }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Deploy via Helm
        run: |
          helm upgrade --install ayurveda \
            oci://ghcr.io/${{ github.repository_owner }}/multi-service \
            --version 1.5.1 \
            --namespace ayur-smoke \
            --wait --timeout 300s \
            --set global.environment=development \
            --set ingress.enabled=false \
            --set namespace.name=ayur-smoke \
            --set backend.image.repository=ghcr.io/${{ github.repository_owner }}/backend \
            --set frontend.image.repository=ghcr.io/${{ github.repository_owner }}/frontend \
            --set backend.image.tag=${{ needs.build-backend.outputs.image-tag }} \
            --set frontend.image.tag=${{ needs.build-frontend.outputs.image-tag }} \
            --set backend.imagePullSecrets[0].name=ghcr-secret \
            --set frontend.imagePullSecrets[0].name=ghcr-secret

      - name: Wait for backend pods
        run: |
          kubectl wait --for=condition=ready pod -l app=backend --namespace ayur-smoke --timeout=120s
          kubectl wait --for=condition=ready pod -l app=frontend --namespace ayur-smoke --timeout=120s

      - name: Smoke test HTTP
        run: |
          kubectl port-forward svc/backend 3001:5000 --namespace ayur-smoke &
          sleep 5
          curl -f http://localhost:3001/api/health
          kill %1

      - name: Debug pods if failure
        if: failure()
        run: |
          kubectl get pods --all-namespaces
          kubectl get pods -n ayur-smoke || true
          kubectl describe pods -n ayur-smoke || true
          kubectl logs -l app=backend -n ayur-smoke --tail=50 || true
          kubectl logs -l app=frontend -n ayur-smoke --tail=50 || true
          kubectl logs -l app=mongodb -n ayur-smoke --tail=50 || true

      - name: Cleanup cluster
        if: always()
        run: k3d cluster delete ayur-smoke

  # ─────────────────────────────────────────────────────────────
  # Job 6 : Déploiement preprod via ArgoCD (main uniquement)
  # ArgoCD sync automatique après mise à jour du tag dans ayur-veda-helm
  # ─────────────────────────────────────────────────────────────
  deploy-preprod:
    if: github.ref == 'refs/heads/main'
    needs: [smoke-test]
    uses: roxane451/ci-cd-helm/.github/workflows/reusable-argocd-sync.yml@main
    with:
      environment: preprod
      image-tag: ${{ needs.build-backend.outputs.image-tag }}
      values-file: values-preprod.yaml
    secrets: inherit

  # ─────────────────────────────────────────────────────────────
  # Job 7 : Déploiement prod via ArgoCD (tags stables uniquement)
  # ─────────────────────────────────────────────────────────────
  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-rc')
    needs: [build-backend, build-frontend]
    uses: roxane451/ci-cd-helm/.github/workflows/reusable-argocd-sync.yml@main
    with:
      environment: prod
      image-tag: ${{ github.ref_name }}
      values-file: values-production.yaml
    secrets: inherit
