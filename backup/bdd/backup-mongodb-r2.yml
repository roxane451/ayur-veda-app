name: MongoDB Backup → Cloudflare R2 (déclenchement manuel)

# Ce workflow ne réimplémente plus la logique de backup : il déclenche le
# CronJob K8s "mongodb-backup" (seule source de vérité pour le dump + upload
# R2) et attend sa complétion. Utile pour la soutenance ou un backup à la
# demande, sans dupliquer le script du CronJob.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Taper "backup" pour confirmer'
        required: true

jobs:
  trigger-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event.inputs.confirm == 'backup' }}

    steps:
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Trigger CronJob mongodb-backup
        id: trigger
        run: |
          JOB_NAME="manual-backup-$(date +%s)"
          echo "job_name=${JOB_NAME}" >> "$GITHUB_OUTPUT"
          kubectl create job --from=cronjob/mongodb-backup "${JOB_NAME}" -n ayur

      - name: Attendre la complétion du job
        run: |
          kubectl wait --for=condition=complete \
            job/${{ steps.trigger.outputs.job_name }} \
            -n ayur --timeout=180s

      - name: Vérifier le backup sur R2
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          LATEST=$(AWS_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}" \
                   AWS_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}" \
                   aws s3 cp \
                     s3://ayur-veda-backups/mongodb/latest.txt - \
                     --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com")
          echo "✅ Dernier backup R2 : ${LATEST}"

      - name: Notify failure
        if: failure()
        run: |
          echo "Backup MongoDB échoué — alerter équipe"
          # curl -X POST "${{ secrets.SLACK_WEBHOOK }}" \
          #   -H 'Content-type: application/json' \
          #   -d '{"text":"Backup MongoDB ayur-veda échoué !"}'
