name: MongoDB Backup → Cloudflare R2

on:
  schedule:
    - cron: "0 3 * * *" # Tous les jours à 3h UTC
  workflow_dispatch: # Déclenchement manuel (soutenance, test)
    inputs:
      confirm:
        description: 'Taper "backup" pour confirmer'
        required: true

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AWS CLI
        run: |
          curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
          unzip -q awscliv2.zip
          sudo ./aws/install --update

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Run backup
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }} # → *** dans logs
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }} # → ***
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ayur-veda-backups
          NAMESPACE: ayur
          DB_NAME: ayur
        run: bash scripts/mongodb-backup-r2.sh

      - name: Verify backup on R2
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          LATEST=$(AWS_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}" \
                   AWS_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}" \
                   aws s3 cp \
                     s3://ayur-veda-backups/mongodb/latest.txt - \
                     --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com")
          echo "✅ Dernier backup R2 vérifié : ${LATEST}"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Backup MongoDB échoué — alerter équipe"
          # curl -X POST "${{ secrets.SLACK_WEBHOOK }}" \
          #   -H 'Content-type: application/json' \
          #   -d '{"text":"❌ Backup MongoDB ayur-veda échoué !"}'
