version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: ayur-mongodb
    restart: unless-stopped
    # FIX 1 : MongoDB tourne désormais en user non-root (uid/gid 999 = user mongodb dans l'image officielle)
    user: "999:999"
    # FIX 2 : Port MongoDB plus exposé à l'extérieur — le backend l'atteint
    #          via le réseau Docker interne ayur-network, pas besoin de binding host.
    # ports:
    #   - "27017:27017"   ← supprimé intentionnellement
    environment:
      MONGO_INITDB_DATABASE: ayur
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}   # pas de fallback en clair
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - ayur-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/ayur --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend API
  backend:
    image: ghcr.io/roxane451/ayur-veda/backend:latest
    container_name: ayur-backend
    restart: unless-stopped
    # FIX 3 : Backend lié uniquement à localhost — le reverse proxy (Nginx/Traefik)
    #          est le seul point d'entrée public.
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      # FIX 4 : URI MongoDB avec authentification — utilise le root user créé par MONGO_INITDB_*
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/ayur?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: 7d
      CORS_ORIGIN: https://ayur-veda.fr
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ayur-network
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      restart_policy:
        condition: on-failure

  # Frontend Web App
  frontend:
    image: ghcr.io/roxane451/ayur-veda/frontend:latest
    container_name: ayur-frontend
    restart: unless-stopped
    # FIX 5 : Frontend lié uniquement à localhost — idem, seul le reverse proxy expose :80/:443
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - ayur-network
    healthcheck:
      test: wget --quiet --tries=1 --spider http://localhost:3000/index.html || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      restart_policy:
        condition: on-failure

networks:
  ayur-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
