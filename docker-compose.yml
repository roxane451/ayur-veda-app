# Stack locale Ayur-Veda
# Pour démarrer :
#   cp .env.example .env   >  renseigner les variables
#   docker compose up -d
#
# Ce fichier sert au dev local et aux tests.
# En prod on passe par le chart Helm sur K3s.
services:
  # --- MongoDB ---
  mongodb:
    image: mongo:7.0
    container_name: ayur-mongodb
    restart: unless-stopped

    # On tourne pas en root
    user: "999:999"

    # Le port 27017 n'est pas exposé à l'extérieur — le backend
    # passe par le réseau Docker interne, pas besoin de l'ouvrir
    # ports:
    #   - "27017:27017"

    environment:
      MONGO_INITDB_DATABASE: ayur
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      # Pas de valeur par défaut ici  si MONGO_INITDB_ROOT_PASSWORD
      # n'est pas dans le .env, Docker va se plaindre, c'est voulu
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}

    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb

    networks:
      - ayur-network

    # Le backend attend que ce healthcheck passe avant de démarrer
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/ayur --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Backend ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ayur-veda-backend:local
    container_name: ayur-backend
    restart: unless-stopped

    # Lié à localhost uniquement — l'API n'est pas accessible
    # directement depuis l'extérieur, ça passe par le reverse proxy
    ports:
      - "127.0.0.1:5000:5000"

    environment:
      NODE_ENV: production
      PORT: 5000
      # L'URI utilise le nom du service Docker (mongodb) comme hostname,
      # Docker se charge de la résolution DNS interne
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/ayur?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: 7d
      CORS_ORIGIN: https://ayur-veda.fr

    # On attend que Mongo réponde vraiment, pas juste qu'il soit démarré
    depends_on:
      mongodb:
        condition: service_healthy

    networks:
      - ayur-network

    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # --- Frontend ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ayur-veda-frontend:local
    container_name: ayur-frontend
    restart: unless-stopped

    # Idem backend — localhost uniquement, le reverse proxy fait le reste
    ports:
      - "127.0.0.1:8888:80"

    depends_on:
      - backend

    networks:
      - ayur-network

    healthcheck:
      test: wget --quiet --tries=1 --spider http://localhost:80/index.html || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Réseau interne — les services se parlent par leur nom
# (le backend fait juste mongodb:27017, Docker gère le reste)
networks:
  ayur-network:
    driver: bridge

# Les données MongoDB survivent aux redémarrages
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
