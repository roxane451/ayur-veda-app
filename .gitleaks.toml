# Configuration Gitleaks v8 — Ayur-Veda App
# Doc : https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml

title = "Ayur-Veda Gitleaks Config"

[extend]
# Hérite de toutes les règles officielles
useDefault = true

# ──────────────────────────────────────────────────────────────────────────────
# Allowlist GLOBALE (syntaxe v8 : [allowlist] = map unique, pas [[]] tableau)
#
# Faux positifs confirmés :
#   - mots de passe FICTIFS dans les tests unitaires
#   - .secrets.baseline : contient des hachages SHA1, pas de vrais secrets
# ──────────────────────────────────────────────────────────────────────────────

[allowlist]
description = "Faux positifs dans les tests et fichiers baseline"

# Paths exclus entièrement (regex sur le chemin du fichier)
paths = [
  '''backend/src/__tests__/.*\.ts$''',
  '''\.secrets\.baseline$''',
]

# Valeurs littérales exclues (regex sur le contenu détecté)
regexes = [
  '''motdepasse123A''',
  '''motdepasse12345''',
  '''Motdepasse123!''',
  '''MotDePasse123!''',
  '''hashed_password''',
]